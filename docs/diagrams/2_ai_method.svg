<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0b2a4a"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a5069" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1600" height="700" fill="#ffffff"/>
  <text x="800" y="60" text-anchor="middle" font-size="38" font-weight="700" fill="#0b2a4a">How AquaMaa answers: facts by code, words by the model</text>
  <text x="800" y="98" text-anchor="middle" font-size="20" fill="#5d7589">No number or source reaches the user unless it came from the data or a cited document</text>

  <g filter="url(#s)">
    <rect x="40" y="250" width="230" height="200" rx="18" fill="#f4f8fa" stroke="#94a3b8" stroke-width="3"/>
    <rect x="320" y="230" width="270" height="240" rx="18" fill="#e0edfb" stroke="#2f80ed" stroke-width="3"/>
    <rect x="650" y="150" width="330" height="190" rx="18" fill="#e0f6f5" stroke="#12bfb7" stroke-width="3"/>
    <rect x="650" y="390" width="330" height="190" rx="18" fill="#ecf1f5" stroke="#64748b" stroke-width="3"/>
    <rect x="1040" y="260" width="250" height="180" rx="18" fill="#dcf5e6" stroke="#16a34a" stroke-width="3"/>
    <rect x="1340" y="250" width="230" height="200" rx="18" fill="#fff1d0" stroke="#e08a00" stroke-width="3"/>
  </g>
  <g font-size="23" font-weight="700" fill="#0b2a4a" text-anchor="middle">
    <text x="155" y="300">Question</text><text x="455" y="275">1. Understand</text><text x="815" y="195">2a. Fast path</text>
    <text x="815" y="435">2b. Deep path</text><text x="1165" y="305">3. Check</text><text x="1455" y="300">4. Answer</text>
  </g>
  <g font-size="16.5" fill="#33505f" text-anchor="middle">
    <text x="155" y="335">typed or spoken</text><text x="155" y="360">Arabic, English,</text><text x="155" y="385">Qatari dialect</text>
    <text x="455" y="310">dialect -> standard Arabic</text><text x="455" y="335">(Fanar, QCRI)</text><text x="455" y="365">misheard words corrected</text>
    <text x="455" y="395">unrelated-looking questions</text><text x="455" y="420">re-read as relevant ones</text>
    <text x="815" y="228">type found by meaning</text><text x="815" y="256">Python builds the facts and verdicts</text>
    <text x="815" y="282">from live readings + FAO / WHO / law</text><text x="815" y="310">one short model call words them</text>
    <text x="815" y="468">open questions: agent searches</text><text x="815" y="494">documents, tables, dashboard</text><text x="815" y="520">(LangGraph ReAct, local Qwen)</text>
    <text x="815" y="546">verifier repairs or removes claims</text>
    <text x="1165" y="340">every number and</text><text x="1165" y="365">source must be</text><text x="1165" y="390">in the facts</text><text x="1165" y="418">else: the deep path</text>
    <text x="1455" y="335">farmer: plain + what to do</text><text x="1455" y="360">officer: figures + options</text>
    <text x="1455" y="390">same language as asked</text><text x="1455" y="418">spoken by a natural voice</text>
  </g>
  <g stroke="#0b2a4a" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M272 350h42"/><path d="M592 330 C620 300 620 250 644 245"/><path d="M592 370 C620 400 620 480 644 485"/>
    <path d="M982 245 C1010 250 1010 320 1034 330"/><path d="M982 485 C1010 480 1010 380 1034 370"/><path d="M1292 350h42"/>
  </g>
  <text x="815" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#12bfb7">most questions: 1-7 s</text>
  <text x="800" y="660" text-anchor="middle" font-size="18" fill="#5d7589">Tested: 21/21 answers in the right language · right source in the top 3 for 26/27 · 11/11 forced failures with no invented answer</text>
</svg>
